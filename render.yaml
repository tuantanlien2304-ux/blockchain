services:
  - type: web
    name: diem-danh-blockchain
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ATTENDANCE_DATA_DIR
        value: /data
      - key: ATTENDANCE_EPHEMERAL
        value: "1"   # ổ đĩa tạm: dữ liệu demo được tạo lại mỗi lần khởi động
      - key: ATTENDANCE_SECRET_KEY
        generateValue: true
